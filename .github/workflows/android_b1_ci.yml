name: Android B1 PhoneAgent APK CI

on:
  push:
    paths:
      - "phase3/b1_android/apk/**"
      - ".github/workflows/android_b1_ci.yml"
  pull_request:
    paths:
      - "phase3/b1_android/apk/**"
      - ".github/workflows/android_b1_ci.yml"
  workflow_dispatch:

env:
  APK_PROJECT_DIR: phase3/b1_android/apk
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.5"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  EMULATOR_API_LEVEL: "34"
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_PROFILE: pixel_6
  APK_OUTPUT_DIR: phase3/b1_android/apk/app/build/outputs/apk
  RELEASE_APK_UNSIGNED: phase3/b1_android/apk/app/build/outputs/apk/release/app-release-unsigned.apk
  RELEASE_APK_SIGNED: phase3/b1_android/apk/app/build/outputs/apk/release/app-release-signed.apk
  DEBUG_APK_PATH: phase3/b1_android/apk/app/build/outputs/apk/debug/app-debug.apk
  ANDROID_TEST_APK_PATH: phase3/b1_android/apk/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  KEYSTORE_TMP_PATH: /tmp/phoneagent-release-keystore.jks
  INSTRUMENTATION_TEST_CLASS: com.adsterra.phoneagent.PhoneAgentInstrumentationTest
  ARTIFACT_NAME: phoneagent-apks

jobs:
  build_and_sign_apk:
    name: Build & Sign PhoneAgent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform & Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Release, Debug & AndroidTest APKs
        run: |
          gradle -p "$APK_PROJECT_DIR" assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Sign Release APK or Verify Unsigned Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          test -s "$DEBUG_APK_PATH"
          test -s "$ANDROID_TEST_APK_PATH"
          test -s "$RELEASE_APK_UNSIGNED"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_TMP_PATH"
            chmod 600 "$KEYSTORE_TMP_PATH"
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
              --ks "$KEYSTORE_TMP_PATH" \
              --ks-pass "env:ANDROID_KEYSTORE_PASS" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "env:ANDROID_KEY_PASS" \
              --out "$RELEASE_APK_SIGNED" \
              "$RELEASE_APK_UNSIGNED"
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify "$RELEASE_APK_SIGNED"
            echo "Signed and verified release APK: $RELEASE_APK_SIGNED"
          else
            echo "ANDROID_KEYSTORE_BASE64 is empty; verified unsigned APK at $RELEASE_APK_UNSIGNED and skipped signing gracefully."
          fi

      - name: Delete Temporary Keystore
        if: always()
        run: |
          rm -f "$KEYSTORE_TMP_PATH"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_OUTPUT_DIR }}/**/*.apk
          if-no-files-found: error

  instrumentation_tests:
    name: Run PhoneAgent Instrumentation Tests
    runs-on: ubuntu-latest
    needs: build_and_sign_apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform & Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumentation Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: gradle -p "$APK_PROJECT_DIR" connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$INSTRUMENTATION_TEST_CLASS"
