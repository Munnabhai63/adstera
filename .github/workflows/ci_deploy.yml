name: Fleet CI & Automated Deployment Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test_and_verify:
    name: Autonomous Test & Invariant Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Run Test Suite
        env:
          CI: "true"
        run: |
          python -m pytest -v

      - name: Run Pre-Flight Invariant Audit
        env:
          CI: "true"
        run: |
          python tests/audit.py

      - name: Deployment Gate Passed
        run: |
          echo "=========================================="
          echo "All unit tests and audit checks PASSED!"
          echo "Fleet controller is 100% verified for production."
          echo "=========================================="
