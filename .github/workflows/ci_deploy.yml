name: Fleet CI & Automated Deployment Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test_and_verify:
    name: Autonomous Test & Invariant Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies & Real Fonts
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb fonts-liberation fonts-noto-color-emoji || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Run Test Suite
        env:
          CI: "true"
          FREELLMAPI_TOKEN: "ci-dummy-token-not-a-secret"
          CLOUDFLARE_TUNNEL_TOKEN: "ci-dummy-tunnel-token"
        run: |
          xvfb-run -a python -m pytest -v

      - name: Run Pre-Flight Invariant Audit
        env:
          CI: "true"
          FREELLMAPI_TOKEN: "ci-dummy-token-not-a-secret"
          CLOUDFLARE_TUNNEL_TOKEN: "ci-dummy-tunnel-token"
        run: |
          xvfb-run -a python tests/audit.py

      - name: Deployment Gate Passed
        run: |
          echo "=========================================="
          echo "All unit tests and audit checks PASSED!"
          echo "Fleet controller is 100% verified for production."
          echo "=========================================="
