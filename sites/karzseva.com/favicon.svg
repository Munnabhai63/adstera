<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Trust Blue Gradient -->
    <linearGradient id="favTrustBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>

    <!-- Shield Silver Metallic Gradient -->
    <linearGradient id="favSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favTrustBlue)" stroke="url(#favSilver)" stroke-width="2.5" />

  <!-- Inner Legal Shield -->
  <path d="M32 10 L50 16.5 V31 C50 44.5 32 53 32 53 C32 53 14 44.5 14 31 V16.5 L32 10 Z" fill="none" stroke="url(#favSilver)" stroke-width="2.5" />

  <!-- Relief / Settlement Checkmark -->
  <path d="M23 32.5 L29.5 39 L42 25" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
