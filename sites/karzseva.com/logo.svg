<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 110" width="430" height="110">
  <defs>
    <!-- Deep Trust Blue Gradient -->
    <linearGradient id="trustBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>

    <!-- Shield Silver Metallic Gradient -->
    <linearGradient id="shieldSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Accent Silver-Blue Highlight -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Emblem Container (Left Side) -->
  <g transform="translate(15, 10)">
    <!-- Outer Metallic Silver Shield -->
    <path d="M44 4 L82 17 V46 C82 72 44 88 44 88 C44 88 6 72 6 46 V17 L44 4 Z" fill="url(#shieldSilver)" />
    
    <!-- Inner Deep Trust Blue Shield -->
    <path d="M44 10 L76 21 V45 C76 67 44 81 44 81 C44 81 12 67 12 45 V21 L44 10 Z" fill="url(#trustBlue)" />

    <!-- Subtle Legal Pillar / Balance Lines -->
    <line x1="26" y1="26" x2="62" y2="26" stroke="url(#shieldSilver)" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

    <!-- Relief & Debt-Free Checkmark + Upward CIBIL Curve -->
    <path d="M27 48 L39 60 L63 33" stroke="url(#shieldSilver)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M27 48 L39 60 L63 33" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Brand Typography (Right Side) -->
  <g transform="translate(112, 61)">
    <!-- Main Brand Name: KarzSeva -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0B192C">Karz</tspan><tspan fill="url(#accentBlue)">Seva</tspan>
    </text>
    
    <!-- Tagline / Niche Subtext -->
    <text x="2" y="23" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#475569" letter-spacing="1.4">
      OTS SETTLEMENT • DEBT RELIEF • CIBIL CARE
    </text>
  </g>
</svg>
