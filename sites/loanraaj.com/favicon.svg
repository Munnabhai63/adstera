  <!-- Financial Growth Bars -->
  <rect x="17" y="40" width="7" height="12" rx="1.5" fill="url(#favGold)" opacity="0.85" />
  <rect x="28.5" y="33" width="7" height="19" rx="1.5" fill="url(#favGold)" opacity="0.95" />
  <rect x="40" y="26" width="7" height="26" rx="1.5" fill="url(#favGold)" />
</svg>
