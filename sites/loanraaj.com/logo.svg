<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    
    <!-- Royal Navy Blue Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Emblem Container (Left Side) -->
  <g transform="translate(15, 12)">
    <!-- Shield / Trust Frame -->
    <path d="M42 4 L78 16 V44 C78 68 42 84 42 84 C42 84 6 68 6 44 V16 L42 4 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Financial Growth Bars inside Shield -->
    <rect x="23" y="48" width="8" height="18" rx="1.5" fill="url(#goldGrad)" opacity="0.85" />
    <rect x="35" y="39" width="8" height="27" rx="1.5" fill="url(#goldGrad)" opacity="0.95" />
    <rect x="47" y="29" width="8" height="37" rx="1.5" fill="url(#goldGrad)" />

    <!-- Upward Growth Arrow -->
    <path d="M56 26 L63 26 L63 33 M63 26 L51 38" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Royal Crown on Top of Bars -->
    <path d="M26 24 L29 16 L36 21 L42 13 L48 21 L55 16 L58 24 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography (Right Side) -->
  <g transform="translate(108, 62)">
    <!-- Main Brand Name: LoanRaaj -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0F172A">Loan</tspan><tspan fill="url(#goldGrad)">Raaj</tspan>
    </text>
    
    <!-- Tagline / Niche Subtext -->
    <text x="2" y="22" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="1.8">
      PERSONAL • BUSINESS • VEHICLE LOANS
    </text>
  </g>
</svg>
