<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant Purple Gradient -->
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Magenta Gradient -->
    <linearGradient id="favMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favPurple)" stroke="url(#favMagenta)" stroke-width="2.5" />

  <!-- Signal Waves -->
  <path d="M36 15 A11 11 0 0 1 47 26" fill="none" stroke="url(#favMagenta)" stroke-width="2.8" stroke-linecap="round" />
  <path d="M36 9 A17 17 0 0 1 53 26" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />

  <!-- DTH Dish -->
  <path d="M15 22 C10 34 17 47 29 50 C35 51 41 49 45 45 L15 22 Z" fill="#FFFFFF" />
  
  <!-- Feedhorn -->
  <line x1="30" y1="33" x2="39" y2="24" stroke="url(#favMagenta)" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="40" cy="23" r="3" fill="url(#favMagenta)" />

  <!-- Dish Base -->
  <path d="M22 49 L17 55 H34 L29 49" fill="none" stroke="#E9D5FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
