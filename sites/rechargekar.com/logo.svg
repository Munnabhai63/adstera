<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110">
  <defs>
    <!-- Vibrant Purple Gradient -->
    <linearGradient id="vibrantPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="55%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Energetic Magenta Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
  </defs>

  <!-- Emblem Container (Left Side) -->
  <g transform="translate(14, 12)">
    <!-- Purple Rounded Badge -->
    <rect x="4" y="4" width="78" height="78" rx="20" fill="url(#vibrantPurple)" stroke="url(#magentaGrad)" stroke-width="2.5" />

    <!-- Satellite / Broadband Signal Waves (Top Right) -->
    <path d="M48 22 A12 12 0 0 1 60 34" fill="none" stroke="url(#magentaGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M48 15 A19 19 0 0 1 67 34" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.9" />

    <!-- DTH Satellite Dish Curve -->
    <path d="M22 30 C16 44 24 60 39 63 C46 64.5 53 62 58 58 L22 30 Z" fill="#FFFFFF" />
    
    <!-- Dish Receiver Feedhorn & Arm -->
    <line x1="40" y1="44" x2="51" y2="33" stroke="url(#magentaGrad)" stroke-width="3.2" stroke-linecap="round" />
    <circle cx="52" cy="32" r="3.5" fill="url(#magentaGrad)" />

    <!-- DTH Stand Base -->
    <path d="M31 62 L25 71 H45 L39 62" fill="none" stroke="#E9D5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Entertainment Play Badge (Bottom Right Corner) -->
    <circle cx="64" cy="62" r="11" fill="url(#magentaGrad)" stroke="#2E1065" stroke-width="2" />
    <polygon points="61.5,57.5 69,62 61.5,66.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography (Right Side) -->
  <g transform="translate(108, 61)">
    <!-- Main Brand Name: RechargeKar -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-0.8">
      <tspan fill="#4C1D95">Recharge</tspan><tspan fill="#DB2777">Kar</tspan>
    </text>
    
    <!-- Tagline / Niche Subtext -->
    <text x="2" y="23" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#475569" letter-spacing="1.4">
      DTH RECHARGE • BROADBAND • FAMILY PACKS
    </text>
  </g>
</svg>
