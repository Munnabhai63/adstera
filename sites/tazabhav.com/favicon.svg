<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Pure Metallic Gold Gradient -->
    <linearGradient id="favPureGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Silver Coin Gradient -->
    <linearGradient id="favSilverCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Dark Slate Gradient -->
    <linearGradient id="favDarkSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favDarkSlate)" stroke="url(#favPureGold)" stroke-width="2.5" />

  <!-- Silver Bullion Coin -->
  <circle cx="44" cy="23" r="11" fill="url(#favSilverCoin)" stroke="#090D16" stroke-width="1.8" />
  <text x="44" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#0F172A" text-anchor="middle">₹</text>

  <!-- Gold Bullion Bar -->
  <polygon points="10,49 17,34 43,34 50,49" fill="url(#favPureGold)" stroke="#FEF08A" stroke-width="1" />
  <polygon points="17,34 22,26 38,26 43,34" fill="#FEF9C3" />
  <text x="30" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#422006" text-anchor="middle">24K</text>

  <!-- Gold Sparkle -->
  <path d="M18 12 L19.5 16.5 L24 18 L19.5 19.5 L18 24 L16.5 19.5 L12 18 L16.5 16.5 Z" fill="#FEF08A" />
</svg>
