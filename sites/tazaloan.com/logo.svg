<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 110" width="430" height="110">
  <defs>
    <!-- Fresh Mint Green Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dark Charcoal Gradient -->
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Emblem Container (Left Side) -->
  <g transform="translate(14, 13)">
    <!-- Dark Charcoal Rounded Square Badge -->
    <rect x="6" y="4" width="76" height="76" rx="20" fill="url(#charcoalGrad)" stroke="#10B981" stroke-width="2.5" />

    <!-- Speed Motion Lines (Left of Bolt) -->
    <line x1="15" y1="28" x2="27" y2="28" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="12" y1="42" x2="23" y2="42" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="16" y1="56" x2="26" y2="56" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- High-Speed Thunderbolt Icon -->
    <path d="M47 16 L28 45 H43 L38 68 L61 37 H46 L47 16 Z" fill="url(#mintGrad)" />

    <!-- Instant Cash / Rupee Spark Badge (Top Right Corner) -->
    <circle cx="67" cy="20" r="11" fill="#10B981" stroke="#111827" stroke-width="2" />
    <text x="67" y="24.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#111827" text-anchor="middle">₹</text>
  </g>

  <!-- Brand Typography (Right Side) -->
  <g transform="translate(108, 61)">
    <!-- Main Brand Name: TazaLoan -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">
      <tspan fill="#10B981">Taza</tspan><tspan fill="#18181B">Loan</tspan>
    </text>
    
    <!-- Tagline / Niche Subtext -->
    <text x="2" y="23" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#52525B" letter-spacing="1.4">
      1-HOUR INSTANT CASH • SALARY ADVANCE
    </text>
  </g>
</svg>
