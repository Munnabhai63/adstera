<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110">
  <defs>
    <!-- Royal Blue Gradient -->
    <linearGradient id="trRoyalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="55%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Investment Green Gradient -->
    <linearGradient id="investGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Wealth Gold Coin Gradient -->
    <linearGradient id="rokdaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Emblem Container (Left Side) -->
  <g transform="translate(14, 12)">
    <!-- Royal Blue Rounded Badge -->
    <rect x="4" y="4" width="78" height="78" rx="20" fill="url(#trRoyalBlue)" stroke="#3B82F6" stroke-width="2.2" />

    <!-- Subtle Stock Grid Lines -->
    <line x1="16" y1="30" x2="70" y2="30" stroke="#60A5FA" stroke-width="1" opacity="0.25" />
    <line x1="16" y1="46" x2="70" y2="46" stroke="#60A5FA" stroke-width="1" opacity="0.25" />
    <line x1="16" y1="62" x2="70" y2="62" stroke="#60A5FA" stroke-width="1" opacity="0.25" />

    <!-- Rising Stock Market Bars -->
    <rect x="19" y="50" width="9" height="18" rx="2" fill="#60A5FA" opacity="0.85" />
    <rect x="33" y="41" width="9" height="27" rx="2" fill="#38BDF8" />
    <rect x="47" y="31" width="9" height="37" rx="2" fill="url(#investGreen)" />
    <rect x="61" y="21" width="9" height="47" rx="2" fill="#4ADE80" />

    <!-- Bullish Upward Trend Line & Arrow -->
    <path d="M18 44 L34 34 L46 38 L66 16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M57 16 H66 V25" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Wealth Rupee Coin Badge (Top Left) -->
    <circle cx="22" cy="22" r="10" fill="url(#rokdaGold)" stroke="#0F172A" stroke-width="1.8" />
    <text x="22" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="900" fill="#0F172A" text-anchor="middle">₹</text>
  </g>

  <!-- Brand Typography (Right Side) -->
  <g transform="translate(108, 61)">
    <!-- Main Brand Name: TazaRokda -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-0.8">
      <tspan fill="#1E3A8A">Taza</tspan><tspan fill="#16A34A">Rokda</tspan>
    </text>
    
    <!-- Tagline / Niche Subtext -->
    <text x="2" y="23" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.3">
      STOCK MARKET • DEMAT • SIP & MUTUAL FUNDS
    </text>
  </g>
</svg>
