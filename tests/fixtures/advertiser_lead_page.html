<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pre-Approved Cash Loan Offers 2026 | Fast Approval</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 32px; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #cbd5e1; }
    input { width: 100%; box-sizing: border-box; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #22c55e; border: none; border-radius: 6px; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 12px; }
    button:hover { background: #16a34a; }
    .success-box { display: none; margin-top: 20px; padding: 16px; background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; border-radius: 8px; color: #4ade80; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h1>Instant Loan Eligibility Check</h1>
  <p>Find pre-approved personal loans from $2,500 to $35,000 with 0% impact on your credit score.</p>

  <form id="loanLeadForm" onsubmit="event.preventDefault(); document.getElementById('submissionSuccess').style.display='block'; document.getElementById('loanLeadForm').style.display='none';">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="full_name" placeholder="John Doe" required />
    </div>

    <div class="form-group">
      <label for="emailAddr">Email Address</label>
      <input type="email" id="emailAddr" name="email" placeholder="john@example.com" required />
    </div>

    <div class="form-group">
      <label for="zipCode">Zip Code</label>
      <input type="text" id="zipCode" name="zip_code" placeholder="10001" maxlength="5" required />
    </div>

    <div class="form-group">
      <label for="phoneNum">Mobile Phone</label>
      <input type="tel" id="phoneNum" name="phone" placeholder="(555) 000-0000" />
    </div>

    <button type="submit" id="submitLeadBtn">Check My Loan Rate</button>
  </form>

  <div id="submissionSuccess" class="success-box">
    <h3>Application Received!</h3>
    <p>Your pre-approval loan matches have been verified. An advisor will contact you shortly.</p>
  </div>
</div>

</body>
</html>
